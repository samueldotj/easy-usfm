[package]
name = "easy-usfm-tauri"
version = "0.1.0"
description = "Desktop shell: file access, atomic save, recovery, watching"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The library holds everything; main.rs is a four-line entry point. Tauri needs
# this shape on mobile, and it also means the shell's logic -- the atomic save
# ladder above all -- is reachable from integration tests without launching a
# window.
name = "easy_usfm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easy-usfm-core = { path = "../easy-usfm-core" }
blake3.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
# Filesystem events (FILE-FIDELITY 3). `notify` falls back to polling itself
# where a platform backend is unavailable, which is common on network mounts
# and in containers -- exactly where translation files often live.
notify = "8"

# ReplaceFileW, not MoveFileEx. FILE-FIDELITY §2: ReplaceFileW preserves the
# destination's ACLs, attributes, creation time, object ID, and alternate data
# streams; MoveFileEx discards them.
# `kill(pid, 0)` is the portable way to ask whether a process is alive, and
# there is no way to ask it from the standard library.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  # Asking whether the process that held a lock is still running (P4.2).
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
easy-usfm-core = { path = "../easy-usfm-core" }
blake3.workspace = true
