[package]
name = "easy-usfm-tauri"
version = "0.2.0"
description = "The desktop editor: easy-usfm's window around the shell plugin"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The library holds the builder; main.rs is a four-line entry point. Tauri
# needs this shape on mobile. Everything the shell *does* -- the save ladder,
# recovery, watching -- is in `tauri-plugin-easy-usfm`, which BibleCompose
# registers too, so the two applications write a file the same way.
name = "easy_usfm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The offline variant (PRODUCT 11, SECURITY 6). `--no-default-features`
# compiles the update check out entirely rather than defaulting a setting to
# off: a setting is a promise, and a missing code path is a fact. Restricted
# deployments are exactly the places that need the difference.
[features]
default = ["updater"]
updater = ["tauri-plugin-easy-usfm/updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-easy-usfm = { path = "../tauri-plugin-easy-usfm" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
