[package]
name = "easy-usfm-cli"
version = "0.1.0"
description = "Command-line access to the USFM engine, for debugging and benchmarking"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "easy-usfm"
path = "src/main.rs"

[dependencies]
usfm-core = { path = "../usfm-core" }
clap = { workspace = true, features = ["derive"] }
serde_json.workspace = true
