[package]
name = "easy-usfm-wasm"
version = "0.1.0"
description = "The USFM engine, compiled for the worker it runs in on every target"
edition.workspace = true
rust-version.workspace = true
# Spelled out rather than inherited, unlike every other crate here.
#
# `wasm-pack` parses this manifest itself rather than asking cargo, and older
# builds of it do not resolve workspace inheritance for these two keys: they
# see `{ workspace = true }` where they expect a string and fail with "invalid
# type: map, expected a string for key `package.license`" before the build
# starts. Which build a runner has depends on what `latest` resolved to when
# its cache was filled, so this failed on macOS while linux and windows
# passed, from the same commit.
#
# The values are the workspace's; `tests/manifest.rs` fails if they drift.
license = "MIT"
repository = "https://github.com/samueldotj/easy-usfm"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack ships a wasm-opt older than the WebAssembly features rustc now
# emits by default, so it rejects its own input with "Bulk memory operations
# require bulk memory". The features are named explicitly rather than turning
# the optimiser off -- it is worth roughly a third of the artifact size, and
# this crate is downloaded on every cold page load in the browser build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-mutable-globals",
  "--enable-sign-ext",
  "--enable-reference-types",
]

[dependencies]
usfm-core = { path = "../usfm-core" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"

# Panics reach the console as a readable message rather than
# "unreachable executed". ARCHITECTURE §12.3 says the parser never panics and
# the fuzz target holds it to that -- this is for the day it does anyway.
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
