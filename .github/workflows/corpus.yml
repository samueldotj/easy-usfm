name: corpus

on:
  push:
  pull_request:

jobs:
  tooling:
    name: corpus tooling self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Self-test (no network)
        run: cargo test --package xtask

  verify:
    name: verify committed corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Hashes, provenance, the redistribution flag, and full coverage across
      # all 218 committed files.
      #
      # Coverage used to be skipped, and not because the gate was inconvenient:
      # six goals had no candidate in anything published. Three were feature
      # classes rare outside alignment-bearing texts -- milestones, sidebars,
      # custom \z markers. Three were encoding traits -- BOM, CRLF, mixed line
      # endings -- that distributors normalise away before publishing, and
      # those three are exactly what FILE-FIDELITY exists to protect, so a
      # wider net was never going to supply them.
      #
      # They are authored fixtures now, in corpus/pathological/, carrying
      # origin = "authored" in the manifest and counting toward coverage.
      # See corpus/README.md.
      - name: Verify hashes, provenance, licence terms, and coverage
        run: cargo xtask corpus verify
