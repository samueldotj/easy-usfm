name: rust

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # There is one engine on every target and it runs in a worker (ADR-002),
      # so the core crate compiling to wasm is not an optional extra -- it is
      # the only way the product runs at all. Checked separately from the host
      # build because the failure it catches is a host-only dependency creeping
      # in, which a host build cannot see.
      - name: Build the engine for wasm32
        run: cargo build --package easy-usfm-core --target wasm32-unknown-unknown
