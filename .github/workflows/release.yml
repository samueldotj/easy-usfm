name: Release artefacts

# Build the editor for three platforms and draft a release from it.
#
# **The release is a draft on purpose.** The workflow does the work and a
# person decides whether it ships, which is also the last gate before an
# unsigned build reaches anybody. Run it from the Actions tab to ask "does this
# still build" without publishing an answer; push a `v*` tag to draft one.
#
# # Unsigned, and saying so
#
# No certificate is configured here and none is referenced. On Windows that
# means SmartScreen will warn on first run, and on macOS that the app is
# quarantined until it is opened from the context menu. That is the honest
# state of this project today: signing certificates are bought rather than
# written, and a build that works unsigned is more useful than one that fails
# because a secret is missing. When there are certificates, the arrangement to
# copy is `bible-compose/.github/workflows/release.yml`, which lifts them to
# the job environment and removes the empty ones — an empty secret is not an
# absent one and the bundler cannot tell the difference.
#
# # Why the frontend is not built separately
#
# `tauri build` runs `beforeBuildCommand`, which is `npm run build`, which
# builds the WASM engine and then the interface. Doing it here as well would
# build it twice and let the two drift; `desktop.yml` builds it on its own
# because it type-checks and tests it, which is a different job.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  installers:
    name: installers (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
          - name: macos
            runner: macos-latest
          # The oldest runner still supported, because a `.deb` built against a
          # newer glibc refuses to install on anything older and the people this
          # is for do not all run the current Ubuntu.
          - name: linux
            runner: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Tauri renders through the system webview: Windows has WebView2 and
      # macOS WKWebView, and Linux needs webkit2gtk — the 4.1 series, which is
      # what Tauri 2 links against. The same list `desktop.yml` installs.
      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # `wasm32` because the interface imports the engine as WASM, and the
      # engine is generated rather than committed — which is what stops it
      # drifting from the Rust it is built from.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the installers
        run: npx tauri build

      # Everything the bundler produced, by the extensions that are installers.
      # Named by platform so the release job can take them apart again.
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  release:
    name: draft the release
    needs: installers
    runs-on: ubuntu-latest
    # Only for a tag. `workflow_dispatch` builds everything and drafts nothing,
    # so the question "does this still build" can be asked without an answer
    # appearing on the releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      # One flat directory, and a checksum file over all of it. A person who
      # downloads an installer should be able to check it against something
      # this workflow wrote rather than against nothing.
      - name: Gather them and take their checksums
        run: |
          mkdir -p release
          find artefacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/*
          body: |
            Easy USFM ${{ github.ref_name }}

            **These artefacts are unsigned.** Windows will warn through
            SmartScreen on first run, and macOS quarantines the application
            until it is opened from the context menu once.

            Check a download against `SHA256SUMS`, which was written by the
            workflow that built them.
