<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy USFM</title>

    <!--
      P5.2. Relative, so the same build works at a domain root and in a
      subdirectory of a static host without a second configuration to keep
      correct. The Tauri build serves this file too and simply ignores it.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-128.png" />
    <meta name="theme-color" content="#2563eb" />

    <!--
      Empty on purpose. This element exists to carry the Content Security
      Policy nonce.

      CodeMirror injects its structural base theme as a style element at
      runtime, which is the one thing keeping 'unsafe-inline' in style-src
      (SECURITY §5). It accepts a nonce and will stamp it on that element — but
      the nonce has to come from whatever generated the policy, and Tauri
      stamps nonces only onto elements already in the served HTML. Vite
      extracts every stylesheet to a link, so without this there is no style
      element for Tauri to stamp and nothing for the editor to read.

      Deleting it does not break anything visibly. It re-breaks the CSP.
    -->
    <style></style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
